<section class="get-touch">
  <div class="container">
    <div class="get-touch__inner d-flex jc-sb">
      <div class="get-touch__box">
        <picture>
          <source srcset="images/get-touchbox.avif" type="image/avif">
          <source srcset="images/get-touchbox.webp" type="image/webp">
          <img src="images/get-touchbox.jpg" width="470" height="624" alt="Alt text">
        </picture>
      </div>
      <div class="get-touch__content">
        <span class="get-touch__overline">Get in Touch</span>
        <h1 class="get-touch__title main-title">Contact
          With Us</h1>
        <div class="get-touch__info d-flex">
          <div class="get-touch__item d-flex ai-center">
            <div class="get-touch__item-icon d-flex jc-sb">
              <a class="get-touch__link" target="_blank" rel="noopener noreferrer" aria-label="open the bakery's address on the map" href="#">
              <svg width="23" height="22">
                <use xlink:href="images/sprite.svg#get-touch1"></use>
              </svg>
              </a>
            </div>
            <div class="get-touch__item-list">
              <span class="get-touch__item-num">01</span>
              <h2 class="get-touch__item-title">Address</h2>
              <address class="get-touch__item-text">764 Richardson Rd.
                Bethpage, NY 11714</address>
            </div>

          </div>
          <div class="get-touch__item d-flex">
            <div class="get-touch__item-icon d-flex jc-sb">
              <a class="get-touch__link" target="_blank" rel="call the bakery on the phone" href="#">
              <svg width="23" height="22">
                <use xlink:href="images/sprite.svg#get-touch2"></use>
              </svg>
              </a>
            </div>
            <div class="get-touch__item-list">
                  <span>02</span>
                  <h2 class="get-touch__item-title">Phone</h2>
                  <a class="get-touch__item-phone">+1 (234) 567-89-02
                    </a>
                </div>
              </div>
            </div>
            <button class="get-touch__btn" type="button">Contact Us</button>
          </div>
        </div>
      </div>
</section>
